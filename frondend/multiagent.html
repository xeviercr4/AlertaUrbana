<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SmartCity AI – Multiagente</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <!-- NAV -->
  <nav class="main-nav">
    <div class="nav-brand">🏙️ SmartCity AI</div>
    <div class="nav-links">
      <a href="index.html" class="nav-link">🎫 Sistema de Tickets</a>
      <a href="rag.html" class="nav-link">🤖 Asistente IA</a>
      <a href="multiagent.html" class="nav-link active">🧠 Multiagente</a>
    </div>
  </nav>

  <!-- CONTENIDO -->
  <div class="container">

    <h1>🧠 Sistema Multiagente</h1>
    <p>Priorización inteligente de incidentes usando IA + RAG</p>

    <!-- INPUT -->
    <h3>📝 Tarea</h3>

    <textarea id="multiagentTask">
Prioriza incidentes de agua según urgencia y normativa municipal
    </textarea>

    <button onclick="runMultiagent()">🚀 Ejecutar Multiagente</button>

    <!-- PANEL DE MONITOREO -->
    <h2 style="margin-top:30px;">🧠 Panel de Monitoreo de Agentes</h2>

    <div id="agent-monitor">

      <!-- PLANNER -->
      <div class="card">
        <h3>🧠 Planner (Subtareas)</h3>
        <div id="plannerResult"></div>
      </div>

      <!-- RESEARCHER -->
      <div class="card">
        <h3>🔎 Researcher (RAG)</h3>
        <div id="researcherResult"></div>
      </div>

      <!-- ANALYST -->
      <div class="card">
        <h3>📊 Analyst</h3>
        <div id="analystResult"></div>
      </div>

      <!-- DECISION -->
      <div class="card">
        <h3>⚖️ Decision (Prioridades)</h3>
        <div id="decisionResult"></div>
      </div>

      <!-- WRITER -->
      <div class="card">
        <h3>✍️ Writer (Resultado Final)</h3>
        <div id="writerResult"></div>
      </div>

    </div>

  </div>

  <script src="multiagent.js"></script>

</body>
</html>
